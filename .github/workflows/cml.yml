name: Iris MLOps CML Report

on: [pull_request]

jobs:
  run-sanity-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Train model
      run: python train.py

    - name: Run tests and post report
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pip install pytest
        echo "## 🧪 Pytest Results" > report.md
        pytest tests/ --tb=short --disable-warnings >> report.md
        npx cml comment create report.md
