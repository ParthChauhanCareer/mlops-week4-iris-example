name: Iris MLOps CML Report

on: [pull_request]

jobs:
  run-sanity-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest scikit-learn cml

    - name: Train model
      run: |
        python train.py

    - name: Run tests
      run: |
        pytest tests/ --junitxml=result.xml

    - name: Report with CML
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "## 🧪 Pytest Results" > report.md
        pytest tests/ --tb=short --disable-warnings >> report.md
        cml comment create report.md
